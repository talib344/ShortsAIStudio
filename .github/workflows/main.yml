name: Shorts AI Studio Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist


  backend:
    name: Build Node Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/server.js


  ai-service:
    name: Build Python AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check Python files
        run: |
          python -m compileall app

      - name: Build completed
        run: echo "AI service build successful"


  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - ai-service

    steps:
      - name: Success
        run: |
          echo "======================================"
          echo " Shorts AI Studio Build Successful!"
          echo " Frontend: OK"
          echo " Node Backend: OK"
          echo " Python AI Service: OK"
          echo "======================================"
